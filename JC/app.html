<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos de la Condena</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: black;
  overflow: hidden;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: black;
  transition: background 1.5s ease;
}

.overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(0,0,0,.1), rgba(0,0,0,.8));
  pointer-events: none;
}

#logo {
  width: 160px;
  opacity: 0;
  transform: scale(0.7);
  transition: all 1.2s cubic-bezier(.19,1,.22,1);
  cursor: pointer;
  filter: drop-shadow(0 0 20px rgba(255,255,255,.4));
}

#logo.show {
  opacity: 1;
  transform: scale(1);
}

.text-box {
  position: absolute;
  background: rgba(0,0,0,.55);
  color: white;
  padding: 18px 28px;
  border-radius: 16px;
  font-size: clamp(1rem, 2vw, 1.4rem);
  letter-spacing: .05em;
  backdrop-filter: blur(6px);
  cursor: pointer;
  opacity: 0;
  transform: translateY(20px);
  transition: all 1s ease;
  box-shadow: 0 10px 30px rgba(0,0,0,.6);
}

.text-box.show {
  opacity: 1;
  transform: translateY(0);
}

.choice {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 12px;
  font-size: 1.4em;
}

.zoom {
  animation: zoom 10s ease forwards;
}

@keyframes zoom {
  from { transform: scale(1); }
  to   { transform: scale(1.08); }
}

.big-bold {
  font-size: 1.8em;
  font-weight: 800;
  letter-spacing: .15em;
}

.si { color: #00ff6a; font-weight: 700; }
.no { color: #ff3b3b; font-weight: 700; }

#logoFinal {
  width: 260px;
  opacity: 0;
  transform: scale(0.6);
  transition: all 1.4s cubic-bezier(.19,1,.22,1);
  filter: drop-shadow(0 0 35px rgba(255,255,255,.45));
  display: none;
}

#logoFinal.show {
  opacity: 1;
  transform: scale(1);
}

</style>
</head>

<body>

<div id="app">
  <div class="overlay"></div>
  <img id="logo" src="./img/notificacion.png" alt="notificacion">
<img id="logoFinal" src="./img/logotipo.svg" alt="logo final">
  <div id="text" class="text-box"></div>
  <audio id="sound" src="./img/notificacion.mp3" preload="auto"></audio>
</div>

<script>
const logoFinal = document.getElementById("logoFinal");

const app   = document.getElementById("app");
const logo = document.getElementById("logo");
const text  = document.getElementById("text");
const sound = document.getElementById("sound");

let step = 0;

/* Mostrar logo */
setTimeout(() => {
  logo.classList.add("show");
  sound.play();
}, 3000);

/* Click logo */
logo.addEventListener("click", () => {
  step = 1;
  logo.style.display = "none";

  cambiarEscena(
    "./img/bg_presentacion.jpg",
    `¿ESTÁS DISPUESTO <span class="big-bold">A TODO</span>?
     <div class="choice">
       <span class="si">SI</span>
       <span class="no">NO</span>
     </div>`
  );
});

/* Click texto */
text.addEventListener("click", () => {

  if (step === 1) {
    step = 2;
    cambiarEscena("./img/bg_presentacion.jpg", "Cada decisión cambia el destino...");

    // Espera 4 segundos y pasa automáticamente al logo
    setTimeout(() => {
      step = 3;
      mostrarLogoFinal();
    }, 4000);
  }

});


function cambiarEscena(imagen, mensaje) {

  text.classList.remove("show");

  setTimeout(() => {
    app.style.background = `url('${imagen}') center/cover no-repeat`;
    app.classList.remove("zoom");
    void app.offsetWidth;
    app.classList.add("zoom");

    text.innerHTML = mensaje;
    text.classList.add("show");

  }, 500);
}

function mostrarLogoFinal() {

  text.classList.remove("show");

  setTimeout(() => {
    app.style.background = "url('./img/bg_presentacion.jpg') center/cover no-repeat";

    logoFinal.style.display = "block";

    setTimeout(() => {
      logoFinal.classList.add("show");
    }, 100);

  }, 600);
}


</script>


</body>
</html>
