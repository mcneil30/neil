<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Episodio 1 Fase 1:Prueba del Grupo Inicial</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
  <style>
    html, body {
  width:100%;
  height:100%;
  margin:0;
}

body {
  display:flex;
  justify-content:center;
  align-items:center;
  background: url("./img/bg_presentacion.jpg") center center / cover no-repeat fixed;
  overflow:hidden;
}

#logo {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 90px;
  opacity: 0.9;
  z-index: 10;
  transition: transform .3s ease, opacity .3s ease;
}

#logo:hover {
  transform: scale(1.08);
  opacity: 1;
}

#menu {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 15px;
  z-index: 10;
}

#menu a {
  padding: 10px 18px;
  background: rgba(0,0,0,.6);
  color: #fff;
  font-family: Arial, sans-serif;
  text-decoration: none;
  border-radius: 20px;
  backdrop-filter: blur(6px);
  transition: all .3s ease;
}

#menu a:hover {
  background: rgba(255,255,255,.9);
  color: #000;
  transform: scale(1.05);
}


/* Contenedor del canvas */
#scene-container {
  width:90vw;
  height:90vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Canvas */
canvas {
  width:100%;
  height:100%;
  border-radius:14px;
  box-shadow:0 0 30px rgba(0,0,0,.7);
  touch-action:none;
}
#loader {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #050505, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  transition: opacity 1s ease, visibility 1s ease;
}

#loader.hide {
  opacity: 0;
  visibility: hidden;
}

.loader-box {
  text-align: center;
  color: #aaa;
}

.spinner {
  width: 70px;
  height: 70px;
  border: 5px solid rgba(255,255,255,0.1);
  border-top: 5px solid #fff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.bar {
  width: 260px;
  height: 6px;
  background: rgba(255,255,255,.1);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 15px;
}

#barFill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#fff,#aaa);
  transition: width .2s ease;
}

  </style>
</head>
<body>
  <div id="loader">
  <div class="loader-box">
    <div class="spinner"></div>
    <div id="loadText">Cargando escenario...</div>
    <div class="bar">
      <div id="barFill"></div>
    </div>
  </div>
</div>

<nav id="menu">
  <a href="index.html">Inicio</a>
  <a href="laberinto.html">Laberinto</a>
  <a href="historia.html">Historia</a>
  <a href="contacto.html">Contacto</a>
</nav>

<div id="scene-container">
  <canvas id="renderCanvas"></canvas>
</div>
<img src="./img/logotipo.svg" id="logo">

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

// ===================
// 🎬 PRELOADER SETUP
// ===================
const loader = document.getElementById("loader");
const barFill = document.getElementById("barFill");
const loadText = document.getElementById("loadText");

// Desactivamos el loader default de Babylon
engine.displayLoadingUI = () => {};
engine.hideLoadingUI = () => {
  loader.classList.add("hide");
};

// Hook de progreso real de carga
BABYLON.SceneLoader.OnPluginActivatedObservable.add(plugin => {
  plugin.onProgressObservable.add(evt => {
    if (evt.lengthComputable) {
      const percent = (evt.loaded / evt.total * 100).toFixed(0);
      barFill.style.width = percent + "%";
      loadText.innerText = `Cargando escenario... ${percent}%`;
    }
  });
});

let touring = true;

// 🎥 Enfoque cinematográfico
function focusCamera(camera, target, radius = 16) {
  BABYLON.Animation.CreateAndStartAnimation(
    "camMove",
    camera,
    "target",
    60,
    40,
    camera.target.clone(),
    target.clone(),
    BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT
  );

  BABYLON.Animation.CreateAndStartAnimation(
    "camZoom",
    camera,
    "radius",
    60,
    40,
    camera.radius,
    radius,
    BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT
  );
}

// 🎯 Hotspot visible + animado + click
function createHotspot(mesh, camera, scene) {
  const hotspot = BABYLON.MeshBuilder.CreateSphere(
    "hotspot_" + mesh.name,
    { diameter: 0.6 },
    scene
  );

  hotspot.position = mesh.getAbsolutePosition().add(new BABYLON.Vector3(0, 2.2, 0));

  const mat = new BABYLON.StandardMaterial("hotspotMat_" + mesh.name, scene);
  mat.emissiveColor = BABYLON.Color3.Red();
  mat.alpha = 0.9;
  hotspot.material = mat;

  const pulse = new BABYLON.Animation(
    "pulse", "scaling", 30,
    BABYLON.Animation.ANIMATIONTYPE_VECTOR3,
    BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE
  );

  pulse.setKeys([
    { frame: 0, value: new BABYLON.Vector3(1, 1, 1) },
    { frame: 15, value: new BABYLON.Vector3(1.5, 1.5, 1.5) },
    { frame: 30, value: new BABYLON.Vector3(1, 1, 1) }
  ]);

  hotspot.animations.push(pulse);
  scene.beginAnimation(hotspot, 0, 30, true);

  hotspot.actionManager = new BABYLON.ActionManager(scene);
  hotspot.actionManager.registerAction(
    new BABYLON.ExecuteCodeAction(
      BABYLON.ActionManager.OnPickTrigger,
      () => {
        touring = false;
        focusCamera(camera, mesh.getAbsolutePosition(), 14);
      }
    )
  );
}

// 🧍 Personajes animados
async function loadCharacters(scene, file, count, offsetX) {
  const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./", file, scene);
  const src = res.meshes.find(m => m instanceof BABYLON.Mesh && m.skeleton);
  if (!src) return [];

  scene.beginAnimation(src.skeleton, 0, 100, true);

  const arr = [];
  for (let i = 0; i < count; i++) {
    const c = src.clone(file + "_" + i);
    c.skeleton = src.skeleton.clone(file + "_sk_" + i);
    c.position.set(offsetX, 0, i * 6);
    scene.beginAnimation(c.skeleton, 0, 100, true);
    arr.push(c);
  }
  src.setEnabled(false);
  return arr;
}

// 📦 Modelos estáticos individuales
async function loadModel(scene, file, position) {
  const res = await BABYLON.SceneLoader.ImportMeshAsync("", "./", file, scene);
  const mesh = res.meshes.find(m => m instanceof BABYLON.Mesh);
  mesh.position.copyFrom(position);
  return mesh;
}

const createScene = async () => {
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.05, 1);

  // 📷 Cámara
  const camera = new BABYLON.ArcRotateCamera("cam",
    Math.PI / 2, Math.PI / 3, 160,
    new BABYLON.Vector3(0, 10, 0), scene);
  camera.attachControl(canvas, true);

  camera.lowerBetaLimit = 0.15;
  camera.upperBetaLimit = Math.PI / 2.1;
  camera.lowerRadiusLimit = 10;
  camera.upperRadiusLimit = 300;
  camera.panningSensibility = 0;
  camera.inertia = 0.85;

  scene.onBeforeRenderObservable.add(() => {
    if (camera.radius > 95 && touring) camera.radius -= 0.6;
  });

  canvas.addEventListener("pointerdown", () => touring = false);

  // 💡 Iluminación
  const moon = new BABYLON.DirectionalLight("moon", new BABYLON.Vector3(-1, -2, -1), scene);
  moon.position = new BABYLON.Vector3(50, 100, 50);
  moon.intensity = 0.9;

  const amb = new BABYLON.HemisphericLight("amb", new BABYLON.Vector3(0, 1, 0), scene);
  amb.intensity = 0.18;

  // 🌍 Suelo
  const ground = BABYLON.MeshBuilder.CreateGround("g", { width: 1000, height: 1000 }, scene);
  ground.position.y = -0.02;

  const groundMat = new BABYLON.PBRMaterial("groundMat", scene);
  groundMat.albedoColor = new BABYLON.Color3(0.1, 0.1, 0.1);
  groundMat.roughness = 0.9;
  groundMat.metallic = 0;
  ground.material = groundMat;

  // 🧱 Laberinto
  await BABYLON.SceneLoader.ImportMeshAsync("", "./c01/laberinto/", "laberinto.glb", scene);

  // 🧍 Personajes
  const c1 = await loadCharacters(scene, "./c01/laberinto/corre_man02.glb", 1, 1);
  const c2 = await loadCharacters(scene, "./c01/laberinto/character02.glb", 1, 40);
  const c3 = await loadCharacters(scene, "./c01/laberinto/corre_m02.glb", 1, 10);
  const s1 = await loadCharacters(scene, "./c01/laberinto/soldado_quieto.glb", 1, 20);
  const s2 = await loadCharacters(scene, "./c01/laberinto/soldado_torre.glb", 1, 0);
  const s3 = await loadCharacters(scene, "./c01/laberinto/jefe_guardia.glb", 1, -15);

  // 🏗️ Props
  const torre = await loadModel(scene, "./c01/laberinto/torre_low.glb", BABYLON.Vector3.Zero());
  const ropa = await loadModel(scene, "./c01/laberinto/ropa_box.glb", BABYLON.Vector3.Zero());
  const soldados_lab = await loadModel(scene, "./c01/laberinto/soldados_laberinto.glb", BABYLON.Vector3.Zero());

  // 🎯 Hotspots
  [...c1, ...c2, ...c3, ...s1, ...s2, ...s3].forEach(m => createHotspot(m, camera, scene));
  createHotspot(torre, camera, scene);

  return scene;
};

createScene().then(scene => {
  engine.hideLoadingUI();
  engine.runRenderLoop(() => scene.render());
});

window.addEventListener("resize", () => engine.resize());
</script>

</body>
</html>
