<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Babylon.js - Laberinto + Múltiples Characters + Dolly + Night</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.js"></script>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    canvas { width:100%; height:100%; touch-action:none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = async () => {
      const scene = new BABYLON.Scene(engine);

      // 🌌 CIELO NOCTURNO
      scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.05, 1);

      // Cámara
      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        Math.PI / 2,
        Math.PI / 3,
        160,
        new BABYLON.Vector3(0, 10, 0),
        scene
      );
      camera.attachControl(canvas, true);

      camera.lowerBetaLimit = 0.005;
      camera.upperBetaLimit = Math.PI / 2.1;
      camera.lowerRadiusLimit = 10;
      camera.upperRadiusLimit = 300;
      camera.panningSensibility = 0;
      camera.allowUpsideDown = false;

      camera.alpha = Math.PI / 2;
      camera.beta  = Math.PI / 3;
      camera.target = new BABYLON.Vector3(0, 10, 0);
      camera.inertia = 0.85;

      // 🎬 DOLLY CINEMATOGRÁFICO
      const targetRadius = 95;
      scene.onBeforeRenderObservable.add(() => {
        if (camera.radius > targetRadius) {
          camera.radius -= 0.6;
        }
      });

      // 🌕 LUZ LUNAR PRINCIPAL
      const moonLight = new BABYLON.DirectionalLight(
        "moonLight",
        new BABYLON.Vector3(-1, -2, -1),
        scene
      );
      moonLight.position = new BABYLON.Vector3(50, 100, 50);
      moonLight.intensity = 0.8;
      moonLight.diffuse = new BABYLON.Color3(0.7, 0.8, 1);

      // 🌑 LUZ AMBIENTAL SUAVE
      const ambient = new BABYLON.HemisphericLight(
        "ambient",
        new BABYLON.Vector3(0,1,0),
        scene
      );
      ambient.intensity = 0.15;
      ambient.diffuse = new BABYLON.Color3(0.2, 0.25, 0.4);
      ambient.groundColor = new BABYLON.Color3(0.05, 0.05, 0.1);

      // Suelo base
      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:1000, height:1000}, scene);
      ground.position.y = -0.02;

      // -------------------
      // 1️⃣ LABERINTO
      // -------------------
      const mazeResult = await BABYLON.SceneLoader.ImportMeshAsync(
        "",
        "./",
        "laberinto.glb",
        scene
      );

      mazeResult.meshes.forEach(m => {
        if (m instanceof BABYLON.Mesh) {
          m.checkCollisions = true;
        }
      });

      console.log("🧱 Laberinto cargado");

      // -------------------
      // 2️⃣ CHARACTER 01
      // -------------------
      await loadCharacters(scene, "character.glb", 1, -40);

      // -------------------
      // 3️⃣ CHARACTER 02
      // -------------------
      await loadCharacters(scene, "character02.glb", 1, 40);

      // -------------------
      // 4️⃣ SOLDADO 01
      // -------------------
      await loadCharacters(scene, "soldado_quieto.glb", 1, 20);

      // -------------------
      // 5️⃣ SOLDADO 02
      // -------------------
      await loadCharacters(scene, "soldado_torre.glb", 1, 1);

      // -------------------
      // 6 CHARACTER 02
      // -------------------
      await loadCharacters(scene, "corre_m02.glb", 1, 40);

     

      return scene;
    };

    // ----------------------------------
    // SISTEMA DE CARGA DE PERSONAJES
    // ----------------------------------
    async function loadCharacters(scene, file, count, offsetX) {

      const result = await BABYLON.SceneLoader.ImportMeshAsync(
        "",
        "./",
        file,
        scene
      );

      const sourceMesh = result.meshes.find(
        m => m instanceof BABYLON.Mesh && m.skeleton
      );

      if (!sourceMesh) {
        console.error("❌ No se encontró skeleton en:", file);
        return;
      }

      const baseSkeleton = sourceMesh.skeleton;
      scene.beginAnimation(baseSkeleton, 0, 100, true);

      const spacing = 8;
      const size = Math.ceil(Math.sqrt(count));
      let index = 0;

      for (let x = -size/2; x < size/2; x++) {
        for (let z = -size/2; z < size/2; z++) {
          if (index >= count) break;

          const clone = sourceMesh.clone(file + "_char_" + index);
          clone.skeleton = baseSkeleton.clone(file + "_skel_" + index);

          clone.position.set(
            x * spacing + offsetX,
            0,
            z * spacing
          );

          clone.rotation.y = 0;

          scene.beginAnimation(clone.skeleton, 0, 100, true);
          index++;
        }
      }

      sourceMesh.setEnabled(false);

      console.log(`🧍 ${count} personajes cargados desde ${file}`);
    }

    createScene().then(scene => {
      engine.runRenderLoop(() => scene.render());
    });

    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
