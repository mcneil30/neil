<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Intro Cinemática</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* VIDEO */
    #video-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* PRELOADER */
    #preloader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111, #000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 1s ease, visibility 1s;
    }

    #preloader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(255,255,255,0.1);
      border-top: 5px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      color: #aaa;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* BOTÓN SALTAR */
    #skipBtn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 14px 30px;
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 30px;
      color: #fff;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(8px);
      transition: all .6s ease;
      z-index: 5;
    }

    #skipBtn.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    #skipBtn:hover {
      background: rgba(255,255,255,.9);
      color: #000;
      transform: translateX(-50%) scale(1.05);
    }
    .saltar_intro {
      text-decoration: none;
    }

    #soundBtn {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 12px 26px;
  background: rgba(0,0,0,.6);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 30px;
  color: #fff;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  backdrop-filter: blur(8px);
  transition: all .6s ease;
  z-index: 5;
}

#soundBtn.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}

#soundBtn:hover {
  background: rgba(255,255,255,.9);
  color: #000;
}

  </style>
</head>
<body>

  <!-- PRELOADER -->
  <div id="preloader">
    <div class="loader"></div>
    <div id="loading-text">Cargando experiencia...</div>
  </div>

  <!-- VIDEO -->
  <div id="video-container">
    <video id="bgVideo" autoplay muted playsinline preload="auto">
      <source src="./video/Demo02.mp4" type="video/mp4">
    </video>
  </div>

  <!-- BOTÓN SALTAR -->
  <button id="skipBtn">Saltar intro</button>
  <!-- BOTÓN SONIDO -->
  <button id="soundBtn">Activar sonido</button>


  <script>
  const video = document.getElementById("bgVideo");
  const preloader = document.getElementById("preloader");
  const container = document.getElementById("video-container");
  const skipBtn = document.getElementById("skipBtn");
  const soundBtn = document.getElementById("soundBtn");

  function showVideo() {
    preloader.classList.add("hide");
    container.style.opacity = 1;

    setTimeout(() => {
      skipBtn.classList.add("show");
      soundBtn.classList.add("show");
    }, 1200);
  }

  video.addEventListener("canplaythrough", showVideo);
  video.addEventListener("loadeddata", showVideo);

  setTimeout(showVideo, 8000);

  skipBtn.addEventListener("click", () => {
    document.body.style.transition = "opacity .6s ease";
    document.body.style.opacity = 0;
    setTimeout(() => window.location.href = "previo.html", 600);
  });

  soundBtn.addEventListener("click", () => {
    video.muted = false;
    video.volume = 0;

    let v = 0;
    const fade = setInterval(() => {
      v += 0.05;
      video.volume = Math.min(v,1);
      if (v >= 1) clearInterval(fade);
    }, 60);

    soundBtn.style.display = "none";
  });
</script>


  </script>

</body>
</html>
